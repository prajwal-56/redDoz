<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Reddox: A precision tool for finding specific Reddit users across the web.">
    <title>Reddox </title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <main class="container">
        <header>
            <h1>Reddox</h1>
            <h2>Wanna stalk someone on reddit , but their posts are hidden from profile ? enter their username and hit search</h2>
        </header>
        
        <div class="search-card">
            <div class="input-wrapper">
                <input type="text" id="redditUsername" placeholder="Reddit Username (e.g. u/spez)..." autocomplete="off">
            </div>

            <div class="input-wrapper" style="margin-top: -5px;">
                <input type="text" id="subredditInput" placeholder="Optional: Subreddit (e.g. privacy)..." autocomplete="off">
            </div>

            <div class="search-options" style="margin-bottom: -5px;">
                <span class="option-chip active" id="opt-all">All</span>
                <span class="option-chip" id="opt-posts">Posts</span>
                <span class="option-chip" id="opt-comments">Comments</span>
            </div>

            <div class="search-options time-filters">
                <span class="option-chip active" data-time="any">Any Time</span>
                <span class="option-chip" data-time="qdr:d">24h</span>
                <span class="option-chip" data-time="qdr:w">Week</span>
                <span class="option-chip" data-time="qdr:m">Month</span>
                <span class="option-chip" data-time="qdr:y">Year</span>
            </div>

            <div class="button-group">
                <button id="searchBtn" class="btn-primary">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                    Search
                </button>
                <button id="copyBtn" class="btn-secondary">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"></path><rect x="8" y="2" width="8" height="4" rx="1" ry="1"></rect></svg>
                    Copy Link
                </button>
            </div>
            
            <div id="result-area"></div>

            <div class="search-history">
                <div class="history-title">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>
                    Recent Searches
                </div>
                <div id="history-list" class="history-list">
                    <!-- History items will be injected here -->
                </div>
            </div>
        </div>

        <footer class="site-footer">
            <p class="footer-note">Searches are performed via <a href="https://www.recordedfuture.com/threat-intelligence-101/threat-analysis-techniques/google-dorks" target="_blank" class="footer-link">Google dorking</a>.</p>
            <div class="footer-links">
                <a href="https://github.com/prajwal-56" target="_blank" class="footer-icon-link" title="GitHub">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0 0 24 12c0-6.63-5.37-12-12-12z"/></svg>
                    prajwal-56
                </a>
                <a href="https://prajwal-56.github.io/donate" target="_blank" class="footer-donate-btn" title="Support this project">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M12 21.593c-5.63-5.539-11-10.297-11-14.402 0-3.791 3.068-5.191 5.281-5.191 1.312 0 4.151.501 5.719 4.457 1.59-3.968 4.464-4.447 5.726-4.447 2.54 0 5.274 1.621 5.274 5.181 0 4.069-5.136 8.625-11 14.402z"/></svg>
                    Support
                </a>
            </div>
        </footer>
    </main>

    <script src="script.js"></script>
</body>
</html>
